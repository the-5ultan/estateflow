spring.application.name=estateflow
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estateflow?connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:estateflow}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=40MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
